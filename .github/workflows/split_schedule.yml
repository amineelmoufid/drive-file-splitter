name: Auto Drive File Splitter & NotebookLM Sync

on:
  schedule:
    # Runs every 30 minutes at off-peak minutes (:07 and :37)
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: drive-file-splitter
  cancel-in-progress: false

jobs:
  split-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Splitter Script
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          SOURCE_FOLDER_ID: ${{ secrets.SOURCE_FOLDER_ID }}
          OUTPUT_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        run: python split_drive.py

      - name: Run Shared Folder Synchronization
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          STRUCTURED_FOLDER_ID: 10GXi-A6ERI6_bpZXG1kUoBtE8ptGy0_b
          RAW_TRANSCRIPTS_FOLDER_ID: 1obO_d69TfTOdJ4OMzsEDNCiza-DjRcrg
          SHARED_FOLDER_ID: 1KI8Cw5scdk4LHOc4SQydG5cqH5UzMDLf
        run: python sync_shared_folder.py

      - name: Run NotebookLM Synchronization
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          NOTEBOOKLM_STORAGE_STATE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
        run: python sync_notebooklm.py
